id_conventions:
  note: >-
    Criteo ids are opaque strings with no type prefix — there is no `cus_`/`inv_` style
    discriminator, so an id carries no evidence of what it identifies. Worse, the SAME
    logical key appears under multiple parameter spellings across the surface.
  casing_inconsistency:
    detail: >-
      Both kebab-case and camelCase spellings of the same key are live in the same spec —
      `account-id` (20 uses) and `accountId` (14), `line-item-id` (23) and `lineItemId`,
      `advertiser-id` (12) and `advertiserId` (7), `balance-id` and `balanceId`,
      `campaign-id` and `campaignId`. A generated client will expose both.
  shared_entities:
    AudienceSegment: present in all three services with separate scopes and separate endpoints
    ContactList: present in all three services
    ApplicationSummaryModel: the /oauth2/token companion, shared by all three specs

