method_note: >-
  Relationships were derived from the RESOURCE PATH HIERARCHY (an id path parameter followed
  by a sub-collection is a has_many edge), not from $ref graph walking. Criteo's 757
  component schemas are dominated by generated envelope wrappers — ValueResourceInputOf*,
  EntityResourceOutcomeOf*, *ListResponse, *Resource — so the $ref graph is mostly transport
  plumbing rather than domain structure. The URL tree is the honest source of the entity
  graph here.

envelope_convention:
  note: >-
    Nearly every schema is a wrapper. The recurring generics are the JSON:API-ish shape Criteo
    generates from: `{Value|Entity}Resource{Input|Outcome}Of<T>` for writes,
    `<T>Resource` / `<T>ListResponse` for reads, with `meta` (totalItems/limit/offset),
    `data`, `warnings` and `errors` at the envelope root.
  wrappers: [ValueResourceInputOf, ValueResourceOutcomeOf, EntityResourceOutcomeOf, ResourceOutcome, ListResponse, Resource, Response]

