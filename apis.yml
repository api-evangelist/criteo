- aid: criteo:criteo-marketing-solutions-api
  name: Criteo Marketing Solutions API
  description: >-
    The Criteo Marketing Solutions API gives advertisers and agencies programmatic access to Criteo's
    commerce media platform for acquisition and retention. 96 operations cover advertisers, campaigns,
    ad sets (start/stop, category bids, display multipliers, delivery limitations, frequency capping,
    geo and targeting rules), ads, creatives, assets and coupons, Product Boost and product sets/filters,
    audiences and audience segments with contact lists and size computation, Marketplace Performance
    Outcomes seller campaigns and budgets, and placements/adset/transactions/transparency reporting.
    OAuth 2.0; nine Marketing Solutions scopes.
  humanURL: https://developers.criteo.com/marketing-solutions/docs/welcome
