apis:
- aid: criteo:criteo-mcp
  name: Criteo MCP Servers
  description: >-
    Criteo operates two remote Model Context Protocol servers. The documentation server at developers.criteo.com/mcp
    is anonymous and was introspected live: three tools (search_criteo_docs, query_docs_filesystem_criteo_docs,
    submit_feedback) and one resource exposing Criteo's published Agent Skill. The API server at mcp.criteo.com/mcp
    is OAuth-protected, publishes RFC 8414 and RFC 9728 metadata, and returns 401 to an anonymous tools/list,
    so its tool set is not enumerated here.
  humanURL: https://developers.criteo.com/
  baseURL: https://developers.criteo.com/mcp
