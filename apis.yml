- aid: criteo:criteo-commerce-grid-api
  name: Criteo Commerce Grid API
  description: >-
    The Criteo Commerce Grid API manages audience segments for Commerce Grid, Criteo's sell-side platform.
    Eight operations create, update, delete and search audience segments and manage contact-list membership
    and statistics. OAuth 2.0 with two scopes, CommerceGrid_Segment_Read and CommerceGrid_Segment_Manage.
    Published at version 2026-01.
  humanURL: https://developers.criteo.com/marketing-solutions/docs/commerce-grid-audience-segments
