- aid: criteo:criteo-marketing-solutions-api
  name: Criteo Marketing Solutions API
  description: >-
    The Criteo Marketing Solutions API provides programmatic access to Criteo's commerce media platform
    for advertisers and agencies running acquisition and retention campaigns. It covers advertiser accounts,
    campaigns and budgets, audience targeting, creative management, analytics, and Criteo's Commerce Growth
    and Commerce Max products.
