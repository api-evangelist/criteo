aid: criteo
name: Criteo
kind: company
description: >-
  Criteo is a global commerce media company whose Retail Media, Marketing Solutions and Commerce Grid
  platforms let retailers, brands, agencies and partners create, launch and measure onsite and offsite
  commerce advertising. Criteo publishes three live OpenAPI 3.0.1 documents at api.criteo.com covering
  219 operations: campaign and line-item management, keyword and promoted-product targeting, audience
  segments and contact lists, retailer catalogs, account and brand hierarchies, balances and billing,
  creative and product-boost management, and demand-side and supply-side analytics. Authentication
  is OAuth 2.0 with client-credentials and authorization-code grants and 22 scopes of the form <Service>_<Domain>_<Level>.
  Criteo ships officially supported Python, PHP and Java SDKs, a public Postman workspace, an llms.txt
  docs index, an A2A agent card, a published Agent Skill, and two remote MCP servers — an anonymous
  documentation server and an OAuth-protected API server at mcp.criteo.com.
