apis:
- aid: criteo:criteo-retail-media-api
  name: Criteo Retail Media API
  description: >-
    The Criteo Retail Media API is a REST API that lets retailers, brands, and agencies build retail media
    campaigns programmatically. It exposes operations for creating and updating campaigns and line items,
    managing audiences and audience algebra nodes, configuring partner and retailer accounts, browsing
    the retailer product catalog, and retrieving demand-side and supply-side analytics including balances
    and billing reports. Authentication uses OAuth 2.0 client credentials, authorization code, or authorization
    code with PKCE.
  humanURL: https://developers.criteo.com/retail-media/docs/welcome-to-criteo
  properties:
  - type: Documentation
    url: https://developers.criteo.com/retail-media/docs/welcome-to-criteo
