- aid: criteo:criteo-retail-media-api
  name: Criteo Retail Media API
  description: >-
    The Criteo Retail Media API lets retailers, brands, agencies and partners build retail media programmatically.
    115 operations across eight tags cover accounts and brand/seller hierarchies, campaigns, auction
    and preferred line items, keywords and bids, promoted products, add-to-basket/audience/store targeting,
    balances and funding, retailer catalogs and categories, creative templates, partner billing, and
    asynchronous analytics (performance, revenue, fill rate, missed opportunities, attributed transactions,
    unfilled placements) plus synchronous real-time performance. OAuth 2.0 client credentials or authorization
    code; 12 Retail Media scopes.
  humanURL: https://developers.criteo.com/retail-media/docs/welcome-to-criteo
