migration_guidance:
  steps:
  - Find your current version in the API call URL.
  - Look up the decommission date in the release schedule — that is the hard deadline.
  - Review the changelog for breaking changes between your version and the target.
  - Update the version segment in the base URL (usually the only change needed).
  - Validate in a test environment before routing production traffic.
  - Monitor 4xx/5xx for the first 48 hours; the old version stays live until its decommission date.
  changelogs:
  - https://developers.criteo.com/retail-media/changelog
  - https://developers.criteo.com/marketing-solutions/changelog
  - https://developers.criteo.com/retailer-integration/changelog

deprecated_operations: []
deprecated_operations_note: >-
  No operation in any of the three published OpenAPI documents carries `deprecated: true`.
  Criteo deprecates at the VERSION level rather than the operation level, so a spec-reading
  client sees no per-operation deprecation signal. Field- and endpoint-level deprecations are
  announced in the changelog and returned at runtime as `deprecation`-type warnings.

