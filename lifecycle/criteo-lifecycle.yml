versioning:
  scheme: uri-path date version
  pattern: https://api.criteo.com/{version}/{criteo-service}/...
  current: '2026-07'
  services: [retailmedia, marketingsolutions, commercegrid]
  cadence: two stable releases per year, January and July
  support_window_months: 12
  docs: https://developers.criteo.com/criteo-apis/docs/versioning-policy
  channels:
  - name: experimental
    url_segment: experimental
    stability: Contracts may change significantly at any time. Not suitable for production.
    legacy_alias: preview
    legacy_note: >-
      The Preview tier was renamed Experimental. The /preview/ path remains available for
      backwards compatibility but is being deprecated during 2026.
  - name: release-candidate
    stability: Production-ready. Rolls directly into the next stable release.
    duration_months: 6
    url_note: Shares its URL with the stable version it becomes, so integrating early needs no migration.
  - name: stable
    stability: Fully supported for 12 months. No breaking changes, ever.

deprecation:
  policy_url: https://developers.criteo.com/criteo-apis/docs/versioning-policy
  sunset_header: false
  deprecation_header: false
  header_note: >-
    Criteo does NOT implement RFC 8594 Sunset or the Deprecation header. Deprecation is
    signalled three ways instead — a published release schedule with fixed dates, email
    reminders during the final three months, and in-band `deprecation`-type entries in the
    error/warning envelope (`deprecated-field`, `endpoint-deprecated`). An agent cannot learn
    a deprecation from response headers; it must read the schedule or parse warnings[].
  window_months: 3
  window_detail: Months 9-12 of the 12-month support window are the deprecation window.
  notification_channels: [email, changelog, release schedule table]
  decommissioned_behavior:
    status: 410
    fall_forward: true
    fall_forward_detail: >-
      When a version is decommissioned, any endpoint whose contract has not changed is
      automatically routed to the current stable version. Only endpoints with breaking changes
      require an explicit migration.

