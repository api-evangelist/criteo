scope_note: >-
  This card advertises the Criteo DOCUMENTATION agent, not the Criteo advertising APIs.
  Its single skill points at a published Agent Skill (saved verbatim to
  skills/criteo-published-skill.md) that teaches an agent how to call the Retail Media and
  Marketing Solutions APIs, so the card is a real, useful discovery surface — but the agent
  it describes answers questions about the docs. The callable API surface is the OpenAPI in
  openapi/ and the OAuth-protected MCP server at https://mcp.criteo.com/mcp.
