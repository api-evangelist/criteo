  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  deviations:
  - supportedInterfaces-not-additionalInterfaces
  - no-description
  - protocolVersion-not-semver
  deviation_notes:
  - >-
    The card carries `supportedInterfaces` where A2A 1.0.0 specifies
    `additionalInterfaces` for the AgentInterface array. This is the single most common
    non-conformance in the catalog and is the reason for the `flavored` grade: the three
    hard shape checks all pass, but the interface array is published under a name an A2A
    1.0.0 client will not read.
  - >-
    `description` is absent. A2A requires a human-readable agent description; without it a
    consuming agent has only the skill description to route on.
  - >-
    `protocolVersion` is "0.3" rather than a full version string such as "0.3.0".
