authentication_codes:
- code: authorization-token-missing
  detail: The Authorization header is missing.
  remediation: "Attach the header: Authorization: Bearer <token>"
- code: authorization-token-expired
  detail: >-
    The access token has expired. Token lifetime is 900 seconds (15 minutes) from generation.
  remediation: >-
    Fetch a new token. Criteo's official client libraries auto-refresh — they check expiry
    before each call and re-fetch. See packages/criteo-packages.yml.
- code: authorization-token-invalid
  detail: Wrong format or wrong content in the Authorization header.
  remediation: Verify the header format and that the token belongs to this application.
- code: authorization-issuer-invalid
  detail: The token originator could not be verified.
  remediation: Contact Criteo API support.
- code: authorization-unknown
  detail: Unknown authorization error.
  remediation: Contact Criteo API support.

problems:
- status: 400
  title: Bad request, invalid syntax
  detail: >-
    Malformed HTTP request — missing body, incompatible header and body, or a serialization
    error. Business validation failures also surface as 400 with fine-grained errors[] detail.
- status: 401
  title: Authentication error
  detail: Invalid credentials or an expired token. See authentication_codes above.
- status: 403
  title: Forbidden
  detail: >-
    Missing permission on the advertiser or domain, or consent was never granted / has been
    revoked by the account owner.
  remediation: Relaunch the OAuth2 flow to re-establish the permission set.
- status: 404
  title: Not found
  detail: Check the correctness of the URL being called.
- status: 410
  title: Gone
  detail: >-
    The API version in the URL has been decommissioned. Endpoints whose contract did not
    change fall forward automatically; the rest require migration.
  source: https://developers.criteo.com/criteo-apis/docs/versioning-policy
- status: 413
  title: Payload too large
  detail: The request payload exceeds what the web server processes in a single request.
  remediation: Chunk the request or use pagination.
- status: 415
  title: Unsupported media type
  detail: Wrong Content-Type — e.g. application/xml where application/json is required.
- status: 429
  title: Rate limit reached
  detail: 250 calls/min on client_credentials (40 on reporting), 10 calls/min on authorization_code.
  remediation: Exponential backoff starting at 1s. Read x-ratelimit-reset.
  source: https://developers.criteo.com/criteo-apis/docs/rate-limits
- status: 500
  title: Internal server error
  detail: >-
    Generic server-side error outside business validation — transient network failure or host
    unavailability.
  remediation: Retry with exponential backoff within a bounded attempt count; indicate the failure in the UI immediately.

silent_failure_modes:
- id: bulk-200-on-permission-failure
  severity: high
  detail: >-
    Bulk requests ALWAYS return 200 regardless of individual entity failures. Failed entities
    are reported as WARNINGS in the response body and excluded from further processing. A 403
    is returned only when the account does not exist or consent is missing outright.
  agent_guidance: >-
    Never treat 200 on a bulk endpoint as success. Parse warnings[] and errors[] and reconcile
    the returned entity count against the submitted count.
- id: empty-search-result
  severity: info
  detail: >-
    An empty search returns 200 with a fully-formed envelope, not 404.
  example: '{"meta":{"totalItems":0,"limit":50,"offset":0},"data":[],"warnings":[],"errors":[]}'
- id: warnings-on-success
  severity: medium
  detail: Warnings may be present on an otherwise successful response and are easy to drop.

