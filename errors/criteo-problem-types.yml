generated: '2026-08-13'
method: searched
source: >-
  https://developers.criteo.com/criteo-apis/docs/api-error-codes +
  https://developers.criteo.com/criteo-apis/docs/api-error-types
derived_from: openapi/criteo-*-api-openapi.yml
format: rfc7807
format_note: >-
  Criteo cites RFC 7807 (Problem Details for HTTP APIs) by name, not its successor RFC 9457.
  The envelope it actually ships is a Criteo variant: rather than a bare problem object it
  returns `{errors: [...], warnings: [...]}` with RFC 7807 member names (type, title, detail,
  instance) inside each array element, plus a Criteo-specific `traceId` and `code`.

spec_gap:
  severity: high
  finding: >-
    Criteo's published OpenAPI declares NO error responses. Across all 219 operations in the
    three 2026-07/2026-01 specs the only declared statuses are 200 (189), 201 (18) and 204
    (16). Zero 4xx, zero 5xx, and no error schema in components. Every fact in this file was
    read from prose documentation because the machine-readable contract does not carry it — a
    generated client or an agent reading the spec alone has no error model at all.
  declared_statuses: {'200': 189, '201': 18, '204': 16}
  declared_error_statuses: 0

envelope:
  shape: '{ "errors": [ ... ], "warnings": [ ... ] }'
  example: |
    {
      "errors": [
        {
          "traceId": "00000000-0000-0000-befd-7e28ff5a4d71",
          "type": "validation",
          "code": "start-after-end-date",
          "instance": "/report",
          "title": "The start date can not be after the end date."
        }
      ]
    }
  fields:
  - name: traceId
    required: true
    description: Technical identifier correlating your request with the backend error. Include it in any support request.
  - name: type
    required: true
    description: Machine-readable error CATEGORY. Drives the recovery tactic.
  - name: code
    required: false
    description: Machine-readable error code, unique per endpoint. Domain-scoped kebab-case.
  - name: instance
    required: false
    description: Machine-readable reference to the endpoint occurrence.
  - name: title
    required: true
    description: Human-readable description. Criteo's guidance is to render it as a dialog title.
  - name: detail
    required: false
    description: Human-readable explanation. Render as dialog content. When absent, title must be sufficient.
  warnings:
    description: >-
      Structurally identical array, semantically like compiler warnings — problems that may
      occur in future. Warnings can be returned on a SUCCESSFUL response.

categories:
- type: access-control
  example_code: insufficient-advertiser-permissions
  example_title: insufficient advertiser permissions
  example_detail: You do not have permission to access this Advertiser
  recovery: Re-run the OAuth2 consent flow, or widen the application's domain authorization level.
- type: availability
  example_code: internal-error
  example_title: Campaigns are unavailable
  example_detail: Campaigns are temporarily unavailable, please try again
  recovery: Retry with exponential backoff; surface a transient-failure state in the UI.
