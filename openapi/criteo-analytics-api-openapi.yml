mentsReportDimensions>\n        </d4p1:Dimensions>\n        <d4p1:Disclosed>false</d4p1:Disclosed>\n        <d4p1:Environment>Web</d4p1:Environment>\n        <d4p1:IsInternal>false</d4p1:IsInternal>\n        <d4p1:Metrics xmlns:d5p1=\"http://schemas.datacontract.org/2004/07/Criteo.Api.Exam.Statistics.Controllers.V1.Models\">\n          <d5p1:PlacementsReportMetrics>Clicks</d5p1:PlacementsReportMetrics>\n          <d5p1:PlacementsReportMetrics>Displays</d5p1:PlacementsReportMetrics>\n          <d5p1:PlacementsReportMetrics>Cost</d5p1:PlacementsReportMetrics>\n        </d4p1:Metrics>\n        <d4p1:Placement>MyPlacement</d4p1:Placement>\n      </Attributes>\n      <Type>report</Type>\n    </ValueResourceOfPlacementsReportQueryMessagetukRIHCU>\n  </Data>\n</ValueResourceCollectionInputOfPlacementsReportQueryMessagetukRIHCU>"
          text/xml:
            schema:
              $ref: '#/components/schemas/PlacementsReportQueryMessageListRequest'
            example: "<ValueResourceCollectionInputOfPlacementsReportQueryMessagetukRIHCU xmlns:i=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns=\"http://schemas.datacontract.org/2004/07/Criteo.Api.Resources\">\n  <Data>\n    <ValueResourceOfPlacementsReportQueryMessagetukRIHCU>\n      <Attributes xmlns:d4p1=\"http://schemas.datacontract.org/2004/07/Criteo.Api.Exam.Statistics.Controllers.V1.Messages\">\n        <d4p1:EndDate>2024-01-04T00:00:00</d4p1:EndDate>\n        <d4p1:StartDate>2024-01-01T00:00:00</d4p1:StartDate>\n        <d4p1:Format>csv</d4p1:Format>\n        <d4p1:Timezone>Europe/Paris</d4p1:Timezone>\n        <d4p1:AdsetIds>\n          <d4p1:Values xmlns:d6p1=\"http://schemas.microsoft.com/2003/10/Serialization/Arrays\">\n            <d6p1:int>135</d6p1:int>\n            <d6p1:int>246</d6p1:int>\n            <d6p1:int>357</d6p1:int>\n            <d6p1:int>468</d6p1:int>\n          </d4p1:Values>\n        </d4p1:AdsetIds>\n        <d4p1:AdvertiserIds>\n          <d4p1:Values xmlns:d6p1=\"http://schemas.microsoft.com/2003/10/Serialization/Arrays\">\n            <d6p1:int>123</d6p1:int>\n            <d6p1:int>456</d6p1:int>\n            <d6p1:int>789</d6p1:int>\n          </d4p1:Values>\n        </d4p1:AdvertiserIds>\n        <d4p1:CampaignIds>\n          <d4p1:Values xmlns:d6p1=\"http://schemas.microsoft.com/2003/10/Serialization/Arrays\">\n            <d6p1:int>111</d6p1:int>\n            <d6p1:int>222</d6p1:int>\n            <d6p1:int>333</d6p1:int>\n            <d6p1:int>444</d6p1:int>\n          </d4p1:Values>\n        </d4p1:CampaignIds>\n        <d4p1:Currency>EUR</d4p1:Currency>\n        <d4p1:Dimensions xmlns:d5p1=\"http://schemas.datacontract.org/2004/07/Criteo.Api.Exam.Statistics.Controllers.V1.Models\">\n          <d5p1:PlacementsReportDimensions>AdsetId</d5p1:PlacementsReportDimensions>\n          <d5p1:PlacementsReportDimensions>AdvertiserId</d5p1:PlacementsReportDimensions>\n          <d5p1:PlacementsReportDimensions>Placement</d5p1:PlacementsReportDimensions>\n        </d4p1:Dimensions>\n        <d4p1:Disclosed>false</d4p1:Disclosed>\n        <d4p1:Environment>Web</d4p1:Environment>\n        <d4p1:IsInternal>false</d4p1:IsInternal>\n        <d4p1:Metrics xmlns:d5p1=\"http://schemas.datacontract.org/2004/07/Criteo.Api.Exam.Statistics.Controllers.V1.Models\">\n          <d5p1:PlacementsReportMetrics>Clicks</d5p1:PlacementsReportMetrics>\n          <d5p1:PlacementsReportMetrics>Displays</d5p1:PlacementsReportMetrics>\n          <d5p1:PlacementsReportMetrics>Cost</d5p1:PlacementsReportMetrics>\n        </d4p1:Metrics>\n        <d4p1:Placement>MyPlacement</d4p1:Placement>\n      </Attributes>\n      <Type>report</Type>\n    </ValueResourceOfPlacementsReportQueryMessagetukRIHCU>\n  </Data>\n</ValueResourceCollectionInputOfPlacementsReportQueryMessagetukRIHCU>"
          application/*+xml:
            schema:
              $ref: '#/components/schemas/PlacementsReportQueryMessageListRequest'
            example: "<ValueResourceCollectionInputOfPlacementsReportQueryMessagetukRIHCU xmlns:i=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns=\"http://schemas.datacontract.org/2004/07/Criteo.Api.Resources\">\n  <Data>\n    <ValueResourceOfPlacementsReportQueryMessagetukRIHCU>\n      <Attributes xmlns:d4p1=\"http://schemas.datacontract.org/2004/07/Criteo.Api.Exam.Statistics.Controllers.V1.Messages\">\n        <d4p1:EndDate>2024-01-04T00:00:00</d4p1:EndDate>\n        <d4p1:StartDate>2024-01-01T00:00:00</d4p1:StartDate>\n        <d4p1:Format>csv</d4p1:Format>\n        <d4p1:Timezone>Europe/Paris</d4p1:Timezone>\n        <d4p1:AdsetIds>\n          <d4p1:Values xmlns:d6p1=\"http://schemas.microsoft.com/2003/10/Serialization/Arrays\">\n            <d6p1:int>135</d6p1:int>\n            <d6p1:int>246</d6p1:int>\n            <d6p1:int>357</d6p1:int>\n            <d6p1:int>468</d6p1:int>\n          </d4p1:Values>\n        </d4p1:AdsetIds>\n        <d4p1:AdvertiserIds>\n          <d4p1:Values xmlns:d6p1=\"http://schemas.microsoft.com/2003/10/Serialization/Arrays\">\n            <d6p1:int>123</d6p1:int>\n            <d6p1:int>456</d6p1:int>\n            <d6p1:int>789</d6p1:int>\n          </d4p1:Values>\n        </d4p1:AdvertiserIds>\n        <d4p1:CampaignIds>\n          <d4p1:Values xmlns:d6p1=\"http://schemas.microsoft.com/2003/10/Serialization/Arrays\">\n            <d6p1:int>111</d6p1:int>\n            <d6p1:int>222</d6p1:int>\n            <d6p1:int>333</d6p1:int>\n            <d6p1:int>444</d6p1:int>\n          </d4p1:Values>\n        </d4p1:CampaignIds>\n        <d4p1:Currency>EUR</d4p1:Currency>\n        <d4p1:Dimensions xmlns:d5p1=\"http://schemas.datacontract.org/2004/07/Criteo.Api.Exam.Statistics.Controllers.V1.Models\">\n          <d5p1:PlacementsReportDimensions>AdsetId</d5p1:PlacementsReportDimensions>\n          <d5p1:PlacementsReportDimensions>AdvertiserId</d5p1:PlacementsReportDimensions>\n          <d5p1:PlacementsReportDimensions>Placement</d5p1:PlacementsReportDimensions>\n        </d4p1:Dimensions>\n        <d4p1:Disclosed>false</d4p1:Disclosed>\n        <d4p1:Environment>Web</d4p1:Environment>\n        <d4p1:IsInternal>false</d4p1:IsInternal>\n        <d4p1:Metrics xmlns:d5p1=\"http://schemas.datacontract.org/2004/07/Criteo.Api.Exam.Statistics.Controllers.V1.Models\">\n          <d5p1:PlacementsReportMetrics>Clicks</d5p1:PlacementsReportMetrics>\n          <d5p1:PlacementsReportMetrics>Displays</d5p1:PlacementsReportMetrics>\n          <d5p1:PlacementsReportMetrics>Cost</d5p1:PlacementsReportMetrics>\n        </d4p1:Metrics>\n        <d4p1:Placement>MyPlacement</d4p1:Placement>\n      </Attributes>\n      <Type>report</Type>\n    </ValueResourceOfPlacementsReportQueryMessagetukRIHCU>\n  </Data>\n</ValueResourceCollectionInputOfPlacementsReportQueryMessagetukRIHCU>"
