            example: "<ValueResourceCollectionInputOfTransactionsReportQueryMessagetukRIHCU xmlns:i=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns=\"http://schemas.datacontract.org/2004/07/Criteo.Api.Resources\">\n  <Data>\n    <ValueResourceOfTransactionsReportQueryMessagetukRIHCU>\n      <Attributes xmlns:d4p1=\"http://schemas.datacontract.org/2004/07/Criteo.Api.Exam.Statistics.Controllers.V1.Messages\">\n        <d4p1:EndDate>2024-01-04T00:00:00</d4p1:EndDate>\n        <d4p1:StartDate>2024-01-01T00:00:00</d4p1:StartDate>\n        <d4p1:Format>csv</d4p1:Format>\n        <d4p1:Timezone>Europe/Paris</d4p1:Timezone>\n        <d4p1:AdvertiserIds>\n          <d4p1:Values xmlns:d6p1=\"http://schemas.microsoft.com/2003/10/Serialization/Arrays\">\n            <d6p1:int>123</d6p1:int>\n            <d6p1:int>456</d6p1:int>\n            <d6p1:int>789</d6p1:int>\n          </d4p1:Values>\n        </d4p1:AdvertiserIds>\n        <d4p1:Currency>EUR</d4p1:Currency>\n        <d4p1:EventType>Display</d4p1:EventType>\n        <d4p1:IsInternal>false</d4p1:IsInternal>\n      </Attributes>\n      <Type>report</Type>\n    </ValueResourceOfTransactionsReportQueryMessagetukRIHCU>\n  </Data>\n</ValueResourceCollectionInputOfTransactionsReportQueryMessagetukRIHCU>"
          application/*+xml:
            schema:
              $ref: '#/components/schemas/TransactionsReportQueryMessageListRequest'
            example: "<ValueResourceCollectionInputOfTransactionsReportQueryMessagetukRIHCU xmlns:i=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns=\"http://schemas.datacontract.org/2004/07/Criteo.Api.Resources\">\n  <Data>\n    <ValueResourceOfTransactionsReportQueryMessagetukRIHCU>\n      <Attributes xmlns:d4p1=\"http://schemas.datacontract.org/2004/07/Criteo.Api.Exam.Statistics.Controllers.V1.Messages\">\n        <d4p1:EndDate>2024-01-04T00:00:00</d4p1:EndDate>\n        <d4p1:StartDate>2024-01-01T00:00:00</d4p1:StartDate>\n        <d4p1:Format>csv</d4p1:Format>\n        <d4p1:Timezone>Europe/Paris</d4p1:Timezone>\n        <d4p1:AdvertiserIds>\n          <d4p1:Values xmlns:d6p1=\"http://schemas.microsoft.com/2003/10/Serialization/Arrays\">\n            <d6p1:int>123</d6p1:int>\n            <d6p1:int>456</d6p1:int>\n            <d6p1:int>789</d6p1:int>\n          </d4p1:Values>\n        </d4p1:AdvertiserIds>\n        <d4p1:Currency>EUR</d4p1:Currency>\n        <d4p1:EventType>Display</d4p1:EventType>\n        <d4p1:IsInternal>false</d4p1:IsInternal>\n      </Attributes>\n      <Type>report</Type>\n    </ValueResourceOfTransactionsReportQueryMessagetukRIHCU>\n  </Data>\n</ValueResourceCollectionInputOfTransactionsReportQueryMessagetukRIHCU>"
