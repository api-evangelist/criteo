        Only provided fields are updated; omitted fields are left unchanged.

        If "enabled" is omitted and only "budgetConfiguration" is provided, "enabled" defaults to false — budget automation will not be activated.

        To activate budget automation, "enabled" must be explicitly set to true along with a valid "budgetConfiguration".

        To deactivate, set "enabled" to false; "budgetConfiguration" can be omitted.'
