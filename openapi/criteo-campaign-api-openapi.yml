          description: Spend limits scheduled to become active in the future. Empty when the campaign has no scheduled spend limits.
        spendLimit:
          $ref: '#/components/schemas/CampaignSpendLimitV23Q1'
      description: "Campaign read model\n            \nThe {id} field is the campaign identifier (string-encoded integer)."
    PatchCampaignScheduledSpendLimitCreation:
      required:
      - spendLimitType
      - startDate
      type: object
      properties:
        spendLimitAmount:
          $ref: '#/components/schemas/NillableDecimal'
        spendLimitRenewal:
          enum:
          - undefined
          - daily
          - monthly
          - lifetime
          type:
          - string
          - 'null'
          description: 'The period over which the campaign spend limit is applied.

            When spendLimitType is "capped", this is "daily", "monthly", or "lifetime".

            When spendLimitType is "uncapped", this is "undefined".'
        spendLimitType:
          enum:
          - capped
          - uncapped
          type:
          - string
          - 'null'
          description: 'Controls whether the campaign has a spend limit.

            "capped" returns a non-null spendLimitAmount.value and a spendLimitRenewal of "daily", "monthly", or "lifetime".

            "uncapped" returns spendLimitAmount.value as null and spendLimitRenewal as "undefined".'
        startDate:
          type:
          - string
          - 'null'
          description: Advertiser-local calendar date when the scheduled spend limit becomes active, for example "2026-09-01".
          format: date
      description: 'Scheduled spend-limit creation.

        The startDate is an advertiser-local calendar date, for example 2026-09-01.

        When spendLimitType is "capped": spendLimitAmount and spendLimitRenewal are required.

        When spendLimitType is "uncapped": spendLimitAmount.value is null and spendLimitRenewal is "undefined".

        All scheduled spend limits for the campaign must use the same spendLimitRenewal as the active spend limit.

        When spendLimitRenewal is "monthly", startDate must be the first day of the month.'
