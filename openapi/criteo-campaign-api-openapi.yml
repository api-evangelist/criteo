    PatchAdSetScheduledBudgetCreationV26Q1:
      required:
      - startDate
      type: object
      properties:
        budgetAmount:
          type:
          - number
          - 'null'
          description: 'Maximum budget amount in the advertiser''s currency per renewal period.

            Required when budgetStrategy is "capped"; must be omitted when budgetStrategy is "uncapped".'
          format: double
        budgetDeliverySmoothing:
          enum:
          - accelerated
          - standard
          type:
          - string
          - 'null'
          description: 'Pacing strategy for spending the budget within a renewal period. Only applicable when budgetStrategy is "capped".

            - "accelerated": spend pacing is based on delivery efficiency rather than the full budget period.

            - "standard": spread spending evenly over the renewal period.

            When budgetStrategy is "uncapped", this field is not set (null in read responses, omit in create/patch requests).'
        budgetDeliveryWeek:
          enum:
          - undefined
          - mondayToSunday
          - tuesdayToMonday
          - wednesdayToTuesday
          - thursdayToWednesday
          - fridayToThursday
          - saturdayToFriday
          - sundayToSaturday
          type:
          - string
          - 'null'
          description: 'Defines which day-of-week boundaries are used for weekly budget renewal. Only applicable when budgetStrategy is "capped", budgetRenewal is "weekly", and budgetDeliverySmoothing is "standard".

            - "mondayToSunday", "tuesdayToMonday", etc.: the day range over which the weekly budget is paced. Changing this value on the active budget also propagates to all scheduled budgets of the same ad set.

            - "undefined": used when budgetStrategy is "uncapped", when budgetRenewal is not "weekly", or when budgetDeliverySmoothing is "accelerated".'
        budgetRenewal:
          enum:
          - undefined
          - daily
          - monthly
          - lifetime
          - weekly
          type:
          - string
          - 'null'
          description: 'The period over which the budget is spent.

            - "daily", "monthly", "weekly": budget resets at the start of each period.

            - "lifetime": budget covers the entire ad set duration without resetting.

            - "undefined": only used when budgetStrategy is "uncapped" (no renewal applies). Required for capped budgets (must not be "undefined").'
        budgetStrategy:
          enum:
          - capped
          - uncapped
          type:
          - string
          - 'null'
          description: 'Controls whether the ad set has a spending limit.

            - "capped": spending is limited to budgetAmount. Requires budgetAmount (non-null), budgetRenewal (not "undefined"), and budgetDeliverySmoothing (not null).

            - "uncapped": no spending limit. budgetAmount is null, budgetRenewal is "undefined", and budgetDeliverySmoothing is null.'
        pacingBehavior:
          enum:
          - undefined
          - targetFullBudget
          - targetAverageDailyBudget
          type:
          - string
          - 'null'
          description: 'Controls how a standard capped budget is paced.

            - "targetFullBudget": spend toward the full budget amount within the renewal period.

            - "targetAverageDailyBudget": spend toward an average daily amount. Only supported for capped, standard, monthly budgets.

            - "undefined": no explicit pacing behavior. Required for uncapped budgets and accelerated budgets.'
        startDate:
          type: string
          description: Advertiser-local calendar date when the scheduled budget becomes active. Required, strictly in the future.
          format: date
      description: 'A budget configuration to schedule on the ad set, becoming active on the specified "startDate".

        It contains the same fields as an active-budget patch, plus the required start date.

        The start date must be strictly in the future and unique among the ad set''s scheduled budgets.

        Creating an "uncapped" scheduled budget: set budgetStrategy to "uncapped" and omit budgetAmount.

        Creating a "capped" scheduled budget: set budgetStrategy to "capped", budgetAmount to a positive number, budgetRenewal to a period, budgetDeliverySmoothing to a pacing strategy and pacingBehavior if budgetDeliverySmoothing is standard.

        Manual scheduled budget changes are not supported when the linked marketing campaign has budget automation enabled.'
    CreateCampaignSpendLimit:
      required:
      - spendLimitType
      type: object
      properties:
        spendLimitAmount:
          type:
          - number
          - 'null'
          description: Maximum spend amount in the advertiser's currency per renewal period. Non-null when capped. null when uncapped.
          format: double
        spendLimitRenewal:
          enum:
          - undefined
          - daily
          - monthly
          - lifetime
          type: string
          description: 'The period over which the spend limit is consumed.

            - "daily", "monthly": spend limit resets at the start of each period.

            - "lifetime": spend limit covers the entire campaign duration without resetting.

            - "undefined": only used when spendLimitType is "uncapped" (no renewal applies).'
        spendLimitType:
          enum:
          - capped
          - uncapped
          type: string
          description: 'Controls whether the campaign has a spending limit.

            - "capped": spending is limited to spendLimitAmount. Requires spendLimitAmount (non-null) and spendLimitRenewal (not "undefined").

            - "uncapped": no spending limit. spendLimitAmount is null and spendLimitRenewal is "undefined".'
      description: 'Spend limit configuration for a marketing campaign. Controls how much can be spent and the renewal cadence.

        When spendLimitType is "capped": spendLimitAmount and spendLimitRenewal are required.

        When spendLimitType is "uncapped": spendLimitAmount is null and spendLimitRenewal is "undefined".'
