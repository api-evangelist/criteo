    BudgetAutomation:
      type: object
      properties:
        budgetConfiguration:
          $ref: '#/components/schemas/BudgetAutomationConfiguration'
        enabled:
          type: boolean
          description: 'Whether budget automation is active for this marketing campaign.

            - true: budget automation is enabled and "budgetConfiguration" must be provided with a valid objective.

            - false (default when omitted): budget automation is disabled; "budgetConfiguration" is ignored if provided.'
      description: 'Budget automation, lets users configure budgets once at the campaign level while Criteo dynamically routes spend toward the best-performing ad sets.

        If "enabled" is omitted and only "budgetConfiguration" is provided, "enabled" defaults to false — budget automation will not be activated.

        To activate budget automation at creation, "enabled" must be explicitly set to true along with a valid "budgetConfiguration".

        If the entire "budgetAutomation" object is omitted from the create request, the campaign is created with budget automation disabled.'
    CampaignV23Q1:
      type:
      - object
      - 'null'
      properties:
        advertiserId:
          type:
          - string
          - 'null'
          description: Advertiser id of the campaign (string-encoded integer)
        budgetAutomation:
          $ref: '#/components/schemas/CampaignBudgetAutomationV23Q1'
        goal:
          enum:
          - unspecified
          - acquisition
          - retention
          type:
          - string
          - 'null'
          description: "Goal of the campaign\n            \nSerialized values are {unspecified}, {acquisition} and {retention}.\n            \nAcquisition and retention are defined as follows:\n- Acquisition: campaign with the goal of acquiring new customers. The success of an acquisition campaign is measured by the number of new customers it brings.\n- Retention: campaign with the goal of retaining existing customers. The success of a retention campaign is measured by the number of existing customers it retains."
        id:
          type:
          - string
          - 'null'
          description: Id of the entity (duplicate of the parent id).
        name:
          type:
          - string
          - 'null'
          description: Name of the campaign
