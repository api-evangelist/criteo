note: >-
  Criteo maintains a separate changelog per product. Entries are labelled by VERSION rather
  than by date — the label is the release train (e.g. "2026.07 Version") and the date is
  implied by the release schedule in lifecycle/criteo-lifecycle.yml. Only the experimental
  entries carry a calendar label. Each entry is tagged, and "Breaking Change" is an explicit
  tag, which makes the breaking-vs-additive split machine-legible. Recent window captured
  below; the live changelogs remain the source of truth.

