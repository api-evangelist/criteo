  - label: August 2026
    tags: [Experimental]
    breaking: false
    highlights:
    - >-
      Line Item Core — a new set of type-agnostic line item endpoints in Experimental. One
      contract for every campaign type: pass a campaignId and the API infers the line item
      type, with type-specific settings carried in a details object (initial support:
      Onsite Display Auction via onsiteDisplayDetails).
    - 'New: POST /line-items, PATCH /line-items/{line-item-id}, POST /line-items/demand-search, POST /line-items/supply-search'
  - label: 2026.07 Version
    tags: [New releases, Breaking Change]
    breaking: true
    highlights:
    - >-
      Versioning policy change — moved to two stable versions per year (January and July) and
      a three-tier release model (Experimental / Release Candidate / Stable), replacing the
      previous Preview + Stable two-tier system.
    - >-
      BREAKING — Retailer Search: targeting eligibility is now reported per budget model.
      `isAvailable` removed; use `budgetModelAvailabilities`.
    - >-
      BREAKING — Real-Time Performance: `billableImpressions` and `billableClicks` renamed to
      `impressions` and `clicks`.
    - 'New: AI Assistant page type — target AI Assistant placements via `aiAssistant` in the line item `pageTypes` field.'
