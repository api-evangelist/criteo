headline: >-
  Criteo's anonymous MCP surface and its REST surface do not overlap at all. Every tool the
  open MCP server exposes is documentation retrieval; every one of the 219 REST operations
  is advertising control. Zero tools bind to an operationId. This is a real, recordable
  divergence — not a mapping we failed to work out — and it is the single most important
  fact about Criteo's agent posture: an agent can currently READ Criteo's docs without
  credentials and can DO nothing without a consented OAuth application.

