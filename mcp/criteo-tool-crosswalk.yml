mcp_only:
- tool: search_criteo_docs
  server: criteo-docs
  reason: >-
    Documentation search over the Criteo Docs knowledge base. Criteo publishes no REST
    search endpoint over its own documentation, so there is no operationId to bind to.
- tool: query_docs_filesystem_criteo_docs
  server: criteo-docs
  reason: >-
    Read-only virtual-filesystem query (rg/grep/cat/tree) over documentation pages and
    OpenAPI specs. A docs-retrieval primitive with no REST analogue.
- tool: submit_feedback
  server: criteo-docs
  reason: >-
    Writes a documentation-quality report to the Criteo docs team. The only non-read tool on
    the open server, and it acts on the docs site rather than on any advertising resource.

