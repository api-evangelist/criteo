currency:
  api_current_stable: '2026-07'
  findings:
  - id: java-sdk-two-versions-behind
    severity: high
    detail: >-
      All three Java SDKs on Maven Central are pinned at 2025.04.0.250626, last published
      2025-06-26 — over thirteen months stale. Criteo's own versioning policy decommissioned
      2025-07 in July 2026 and lists 2026-01 as the current ACTIVE stable with 2026-07 rolling
      out. The Java client therefore wraps a version Criteo has already retired, while the
      PHP client shipped a build two days ago.
  - id: python-sdk-one-version-behind
    severity: medium
    detail: >-
      The Python SDKs are versioned 2026.1.0 (published 2026-06-01), tracking the 2026-01
      stable rather than the 2026-07 stable that the OpenAPI at api.criteo.com now serves.
  - id: commercegrid-java-missing
    severity: medium
    detail: >-
      The Commerce Grid Java SDK is documented and linked but absent from Maven Central.
  - id: php-is-the-live-client
    severity: info
    detail: >-
      PHP is the only language whose SDK is genuinely current — 624 published releases and a
      build dated 2026-08-11, effectively a per-commit release train.

