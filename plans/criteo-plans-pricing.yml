supersedes: >-
  Replaces the 2026-05-04 bulk-sweep scaffold, which invented a "criteo-free" tier with a
  1,000 requests/month quota. Criteo publishes no such tier and no such quota. Recorded here
  as a measured zero instead.

description: >-
  Criteo publishes no priced plans for its APIs, and no rate card for the advertising
  platform the APIs control. API access is not a product Criteo sells; it is an entitlement
  that comes with a Criteo commercial relationship. Media itself is bought on auction/CPC and
  negotiated per contract, so there is nothing tiered to record.

plan_count: 0

access_model:
  api_priced_separately: false
  api_access_requires: an existing Criteo commercial relationship (advertiser, retailer, agency or partner)
  onboarding: >-
    Self-serve for the developer artefacts (partner account, organization, API application,
    client_id/client_secret) once you have an account. The account itself is not self-serve
    for Retail Media or Marketing Solutions.
  steps_docs: https://developers.criteo.com/criteo-apis/docs/connect-to-the-api
  free_trial: false
  pricing_page: null
  pricing_page_note: >-
    Probed 2026-08-13. https://www.criteo.com/pricing/ and https://www.criteo.com/plans/ both
    return HTTP 404. There is no published rate card anywhere on criteo.com.

self_serve_product:
  name: Criteo GO
  url: https://go.criteo.com/
  status: 200
  description: >-
    Criteo's self-serve SMB product (Shopify onboarding, AI-managed cross-channel campaigns).
    It is the one Criteo surface a business can start without a salesperson, and the closest
    thing to a public plan.
  published_prices: false
  published_prices_note: >-
    The landing page carries a promotional offer — "Get up to $1500 in free ad credit. Terms
    apply" — and a Performance Estimator, but no tier list, no monthly price, no minimum
    spend and no included quota. Signup is gated behind "Get started" / "Book a call".
  entry_points: [Get started, Book a call, Log in]
  api_access: >-
    Criteo GO is not exposed through the developer APIs documented at developers.criteo.com.

what_is_actually_metered:
  note: >-
    Nothing in the API is billed per call. The metered surfaces are rate limits (see
    rate-limits/criteo-rate-limits.yml) and media spend, which is governed by Balance entities
    on the Retail Media API rather than by a plan.
  balances_api: openapi/criteo-retail-media-api-openapi.yml
  balance_scopes: [RetailMedia_Balance_Read, RetailMedia_Balance_Manage]
  billing_reports_scope: RetailMedia_Billing_Read

